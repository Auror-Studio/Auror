<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="50%" stop-color="#21252b"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="40%" stop-color="#ff9900"/>
      <stop offset="70%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#333842" stroke-width="6"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2c313a" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Waveform & Sound Waves (Aurora Glow) -->
  <g filter="url(#glow)">
    <!-- Equalizer Spectrum Bars (DAW Vibe) -->
    <rect x="110" y="230" width="22" height="52" rx="11" fill="url(#auroraGrad)"/>
    <rect x="146" y="190" width="22" height="132" rx="11" fill="url(#auroraGrad)"/>
    <rect x="182" y="140" width="22" height="232" rx="11" fill="url(#auroraGrad)"/>
    <rect x="218" y="90" width="22" height="332" rx="11" fill="url(#accentGrad)"/>
    
    <!-- Central Sound Peak (FL Flame / Aurora Apex) -->
    <path d="M 256 70 C 275 140 310 180 290 270 C 278 320 234 330 256 420 C 240 370 210 320 226 250 C 240 190 245 130 256 70 Z" fill="url(#auroraGrad)"/>

    <rect x="272" y="120" width="22" height="272" rx="11" fill="url(#accentGrad)"/>
    <rect x="308" y="170" width="22" height="172" rx="11" fill="url(#auroraGrad)"/>
    <rect x="344" y="210" width="22" height="92" rx="11" fill="url(#auroraGrad)"/>
    <rect x="380" y="240" width="22" height="32" rx="11" fill="url(#auroraGrad)"/>
  </g>

  <!-- Dial / Knob Indicator Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="250"/>
  
  <!-- Modern Glow Center Node -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>
