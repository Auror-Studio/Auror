[workspace]
resolver = "2"
members = [
    "crates/openstudio-core",
    "crates/openstudio-gpu",
    "crates/openstudio-dsp",
    "crates/openstudio-audio",
    "crates/openstudio-plugins",
    "crates/openstudio-project",
    "crates/openstudio-ui",
    "src-bin",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.18"
rtrb = "0.4"
hound = "3.5"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
gtk4 = "0.9"
glib = "0.20"
cairo-rs = "0.20"
pango = "0.20"
